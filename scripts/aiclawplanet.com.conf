server
{
    listen 80;
    server_name aiclawplanet.com www.aiclawplanet.com;
    index index.html;
    root /www/wwwroot/aiclawplanet.com;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/aiclawplanet.com.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/aiclawplanet.com/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    #ERROR-PAGE-END

    # SPA history mode - 所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    #禁止访问的文件或目录
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # JS/CSS 文件 - 禁止缓存，强制每次从源站获取
    location ~ .*\.(js|css)$
    {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        error_log /dev/null;
        access_log /dev/null;
    }

    # 图片缓存30天
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    # Supabase API 代理
    location /sb-api/ {
        proxy_pass https://oqhgrglihrelyzigginq.supabase.co/;
        proxy_set_header Host oqhgrglihrelyzigginq.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    access_log  /www/wwwlogs/aiclawplanet.com.log;
    error_log  /www/wwwlogs/aiclawplanet.com.error.log;

}
